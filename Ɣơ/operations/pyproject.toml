[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eria-operations-observer"
version = "0.1.0"
description = "Read-only Runflow narrative, evidence and operable observer"
requires-python = ">=3.11"
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
eria-observer = "gamma_ops.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
