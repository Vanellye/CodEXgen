name: Ruble-I simulator

on:
  push:
    paths:
      - "ruble-i/**"
      - ".github/workflows/ruble-i-simulator.yml"
  pull_request:
    paths:
      - "ruble-i/**"
      - ".github/workflows/ruble-i-simulator.yml"

jobs:
  simulator-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s ruble-i/tests -v
      - name: Run deterministic example
        run: python ruble-i/runtime.py ruble-i/examples/allowance-and-exchange.rubi --at 2026-11-20T10:30:00Z
