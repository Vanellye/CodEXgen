name: Ruble-I v4 prepare-only
on:
  push:
    paths:
      - 'ruble-i/v4/**'
      - '.github/workflows/ruble-i-v4.yml'
  pull_request:
    paths:
      - 'ruble-i/v4/**'
      - '.github/workflows/ruble-i-v4.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run v4 safety and adapter tests
        run: python -m unittest discover -s ruble-i/v4/tests -v
