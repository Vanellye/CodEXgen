name: Build Æị Android APK
on:
  push:
    branches: [feature/aie-standalone-and-apk]
    paths:
      - "aie-android/**"
      - "aie-standalone/**"
      - ".github/workflows/aie-android.yml"
  pull_request:
    branches: [feature/aie-standalone-and-apk]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Build debug APK
        run: ./gradlew -p aie-android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: aie-debug-apk
          path: aie-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
