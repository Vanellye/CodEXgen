name: CodEXgen Platform CI

on:
  push:
    branches:
      - olpirt/stride-next
  pull_request:
    branches:
      - olpirt/stride-next
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codexgen-platform-${{ github.ref }}
  cancel-in-progress: false

jobs:

  geometry-browser-tests:
    name: Geometry Laboratory browser automation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up Python static server
        run: python3 --version
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save @playwright/test@1.52.0
          npx playwright install --with-deps chromium
      - name: Run interactive laboratory browser tests
        run: npx playwright test --config=playwright.config.cjs
  node11-runtime-contract:
    name: Pantheon shared Node.js 11 runtime contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up pinned Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: '11.15.0'
      - name: Verify every Pantheon Node.js process uses the shared runtime
        run: npm test

  python-validation:
    name: Python compatibility engines and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: python/requirements.txt
      - name: Install test dependencies
        run: python -m pip install --upgrade pip numpy
      - name: Compile Python compatibility sources
        run: python -m compileall -q python tests generated_modules hypotheticals
      - name: Run Python reference tests
        run: python -m unittest discover -s tests -v

  pantheon-native:
    name: Pantheon native C++11 host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pantheon
        run: cmake -S pantheon -B build/pantheon -DCMAKE_CXX_STANDARD=11
      - name: Build Pantheon
        run: cmake --build build/pantheon --parallel 2
      - name: Run Pantheon smoke tests
        run: ctest --test-dir build/pantheon --output-on-failure

  android-java-views:
    name: Android Views Java source compatibility
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 8 for the legacy Android Gradle toolchain
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install API 29 compile platform
        run: sdkmanager "platforms;android-29" "build-tools;29.0.3"
      - name: Enable Gradle wrapper
        run: chmod +x ./gradlew
      - name: Compile Android Views Java sources
        run: ./gradlew --no-daemon --stacktrace :app:compileDebugJavaWithJavac

  android-api11-views:
    name: Android API 11 Views and C++11 JNI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17 for current Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install API 29 and CMake toolchains
        run: |
          sdkmanager "platforms;android-29" "build-tools;29.0.3" "cmake;3.10.2"
      - name: Install archived NDK r16b for API 11
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/ndk/16.1.4479499"
          curl --fail --location --retry 3 https://dl.google.com/android/repository/android-ndk-r16b-linux-x86_64.zip -o "$RUNNER_TEMP/ndk-r16b.zip"
          mkdir -p "$RUNNER_TEMP/ndk-r16b"
          unzip -q "$RUNNER_TEMP/ndk-r16b.zip" -d "$RUNNER_TEMP/ndk-r16b"
          cp -a "$RUNNER_TEMP/ndk-r16b/android-ndk-r16b/." "$ANDROID_SDK_ROOT/ndk/16.1.4479499/"
      - name: Set up JDK 8 for legacy Gradle and Java 6 bytecode
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Enable Gradle wrapper
        run: chmod +x ./gradlew
      - name: Assemble API 11 Views APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug
      - name: Upload API 11 APK
        uses: actions/upload-artifact@v4
        with:
          name: codexgen-android-api11-views-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
