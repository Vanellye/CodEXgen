name: ERIA Continuous Forge

on:
  push:
  pull_request:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eria-forge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  forge-validation:
    name: Read-only ERIA validation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Git object connectivity
        run: git fsck --no-reflogs --connectivity-only
      - name: Check committed diff whitespace
        run: git diff-tree --check --root -r HEAD
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run isolated storage-boundary tests
        env:
          PYTHONPATH: security/red-write-only
        run: python -m unittest discover -s security/red-write-only/tests -v
      - name: Run Pantheon contracts when present
        shell: bash
        run: |
          if [[ -f pantheon/run-contract-tests.sh ]]; then
            bash pantheon/run-contract-tests.sh
          else
            echo "No Pantheon contract runner in this repository; skipped."
          fi

# Read-only validation only. No deployment, merge, external dispatch,
# untrusted payload execution, hardware activation, or biological intervention.
