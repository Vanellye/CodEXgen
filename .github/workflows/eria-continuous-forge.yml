name: ERIA Continuous Forge

on:
  push:
  pull_request:
  workflow_run:
    workflows:
      - "Independent Branch CI"
      - "ERIA Write-Only Storage Boundary CI"
    types: [completed]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eria-forge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  forge-validation:
    name: Read-only ERIA validation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Git object connectivity
        run: git fsck --no-reflogs --connectivity-only
      - name: Check committed diff whitespace
        run: git diff-tree --check --root -r HEAD
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run isolated storage-boundary tests
        env:
          PYTHONPATH: security/red-write-only
        run: python -m unittest discover -s security/red-write-only/tests -v
      - name: Run invention event tests
        env:
          PYTHONPATH: tools
        run: python -m unittest discover -s tests -p 'test_eria_invention_events.py' -v
      - name: Generate event-driven invention pulse
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
        run: python tools/eria_invention_events.py
      - name: Run Pantheon contracts when present
        shell: bash
        run: |
          if [[ -f pantheon/run-contract-tests.sh ]]; then
            bash pantheon/run-contract-tests.sh
          else
            echo "No Pantheon contract runner in this repository; skipped."
          fi

# Read-only validation and proposal generation only. No deployment, merge,
# source mutation, external dispatch, generated-code execution, hardware
# activation, or biological intervention.
