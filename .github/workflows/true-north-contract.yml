name: Build Speed TRUE NORTH Contract

on:
  push:
    branches: [build-speed]
    paths:
      - "app/src/main/java/com/vanellye/codexgen/contracts/**"
      - "app/src/test/**"
      - "app/build.gradle.kts"
      - ".github/workflows/true-north-contract.yml"
  pull_request:
    paths:
      - "app/src/main/java/com/vanellye/codexgen/contracts/**"
      - "app/src/test/**"
      - "app/build.gradle.kts"
      - ".github/workflows/true-north-contract.yml"

permissions:
  contents: read

jobs:
  android-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Run Android contract tests
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
