name: Independent Branch CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: independent-branch-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-integrity:
    name: Source integrity and whitespace
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Git object connectivity
        run: git fsck --no-reflogs --connectivity-only
      - name: Check committed diff whitespace
        run: git diff-tree --check --root -r HEAD

  python-validation:
    name: Python syntax and available unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python test dependency
        run: python -m pip install numpy
      - name: Verify quarantined source remains byte-for-byte unchanged
        shell: bash
        run: |
          set -euo pipefail
          source_file="hypotheticals/bio_resonance_fiction.py"
          expected_blob="2d689a275e0a2bf39a1c1fa14afe3d84fb5589c2"
          test -f "$source_file"
          actual_blob="$(git hash-object "$source_file")"
          if [[ "$actual_blob" != "$expected_blob" ]]; then
            echo "Quarantined source changed; stop for explicit review."
            echo "Expected blob: $expected_blob"
            echo "Actual blob:   $actual_blob"
            exit 1
          fi
          echo "Quarantined source preserved exactly; semantic repair remains unauthorized."
      - name: Compile all non-quarantined Python sources
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.py' \
            ! -path './hypotheticals/bio_resonance_fiction.py' \
            -print0 | xargs -0 -r python -m py_compile
      - name: Run unit tests when a test suite exists
        shell: bash
        run: |
          if [[ -d tests ]]; then
            python -m unittest discover -s tests -v
          else
            echo "No tests/ directory on this branch; syntax validation only."
          fi

  android-debug-build:
    name: Android debug APK build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install declared Android compile platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install Android NDK and CMake for JNI build
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Run Android unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug
