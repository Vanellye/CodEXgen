name: ERIA Rekor provenance anchor

on:
  pull_request:
    branches:
      - feature/eria-multicurrency-pons-transfer-gate
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  sign-and-anchor:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out provenance source
        uses: actions/checkout@v7
        with:
          ref: acbe77e46c4c66d89929480de1c4a261b7573069
          fetch-depth: 0

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.3

      - name: Create provenance statement
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          statement = {
              "schema": "https://in-toto.io/Statement/v1",
              "predicateType": "https://eria.example/provenance/ci-run/v1",
              "subject": [{
                  "name": "Vanellye/CodEXgen",
                  "digest": {"gitCommit": "acbe77e46c4c66d89929480de1c4a261b7573069"}
              }],
              "predicate": {
                  "repository": "https://github.com/Vanellye/CodEXgen",
                  "sourceRef": "fix/pons-audit-home-isolation",
                  "sourceCommit": "acbe77e46c4c66d89929480de1c4a261b7573069",
                  "ciWorkflow": "Independent Branch CI",
                  "ciRunId": "44278993559",
                  "ciRunUrl": "https://github.com/Vanellye/CodEXgen/actions/runs/44278993559",
                  "ciConclusion": "success",
                  "anchoringWorkflow": ".github/workflows/rekor-provenance.yml",
                  "signerIdentityMode": "GitHub Actions OIDC keyless workflow identity; no personal email asserted"
              }
          }
          with open("eria-provenance.json", "w", encoding="utf-8") as f:
              json.dump(statement, f, sort_keys=True, separators=(",", ":"))
              f.write("\n")
          PY

      - name: Sign statement and submit to public Rekor
        run: cosign sign-blob --yes --bundle eria-provenance.sigstore.json eria-provenance.json

      - name: Verify signature and Rekor inclusion proof
        env:
          CERTIFICATE_IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: |
          cosign verify-blob eria-provenance.json \
            --bundle eria-provenance.sigstore.json \
            --certificate-identity="${CERTIFICATE_IDENTITY}" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com"

      - name: Publish provenance and Sigstore bundle
        uses: actions/upload-artifact@v6
        with:
          name: eria-rekor-provenance
          path: |
            eria-provenance.json
            eria-provenance.sigstore.json
          if-no-files-found: error
          retention-days: 90
