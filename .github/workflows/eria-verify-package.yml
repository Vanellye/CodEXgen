name: ERIA verify and package

on:
  push:
    branches:
      - god/heritage-lineage
    paths:
      - "app/**"
      - "tools/**"
      - "termux/**"
      - "pantheon/**"
      - "shared/**"
      - "GOD/**"
      - "docs/**"
      - "gradle/**"
      - "gradlew"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/eria-verify-package.yml"

permissions:
  contents: read

concurrency:
  group: eria-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-package:
    name: Static verification and deployable artifacts
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python sources without executing them
        run: python -m compileall -q tools

      - name: Validate GOD schemas as JSON
        run: |
          python -m json.tool GOD/RECORD.schema.json >/dev/null
          python -m json.tool GOD/PLZ/plz-event.schema.json >/dev/null

      - name: Validate Termux shell syntax
        shell: bash
        run: |
          shopt -s nullglob
          scripts=(termux/*.sh)
          if (( ${#scripts[@]} == 0 )); then
            echo "No Termux shell scripts found" >&2
            exit 1
          fi
          for script in "${scripts[@]}"; do
            bash -n "$script"
          done

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build unsigned Android debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Assemble Termux source bundle and integrity manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/eria-debug-unsigned.apk
          tar -czf dist/eria-termux-source.tar.gz \
            --exclude='__pycache__' --exclude='*.pyc' \
            tools termux pantheon shared docs README.md README-ANDROID-ERIA.md \
            GOD/RECORD.schema.json GOD/PLZ/plz-event.schema.json \
            GOD/SHOP/README.md GOD/README.md GOD/COLLECTOR.md
          python - <<'PY'
          import hashlib, json, os
          paths = ["dist/eria-debug-unsigned.apk", "dist/eria-termux-source.tar.gz"]
          manifest = {
              "commit": os.environ["GITHUB_SHA"],
              "ref": os.environ["GITHUB_REF"],
              "artifacts": {
                  path: {
                      "bytes": os.path.getsize(path),
                      "sha256": hashlib.sha256(open(path, "rb").read()).hexdigest(),
                  }
                  for path in paths
              },
              "validation": [
                  "python compileall (syntax compilation only)",
                  "JSON schema parsing",
                  "Termux bash syntax checks",
                  "Gradle assembleDebug",
              ],
              "tests_executed": False,
              "deployment_status": "artifact-only; no device or server deployment",
              "signing_status": "debug APK is unsigned for production distribution",
          }
          with open("dist/deployment-manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PY
          (cd dist && sha256sum eria-debug-unsigned.apk eria-termux-source.tar.gz deployment-manifest.json > SHA256SUMS)

      - name: Upload versioned deployment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eria-verified-package-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
