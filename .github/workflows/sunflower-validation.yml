name: Sunflower and DeepAppState validation

on:
  pull_request:
    branches:
      - chore/node24-pantheon-workflow-modernization
  push:
    branches:
      - feature/sunflower-gamma-deepappstate

permissions:
  contents: read

jobs:
  sunflower-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run Sunflower unit tests
        run: python -m unittest tests.test_sunflower_generator -v
      - name: Verify CLI entry point
        run: python -m sunflower.generator --help
      - name: Check whitespace
        run: git diff --check
