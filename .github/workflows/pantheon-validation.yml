name: Pantheon focused validation

on:
  push:
    branches:
      - pantheon/source-digest-engine
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  pantheon-tests:
    name: Non-executing source analysis tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Pantheon package and focused tests
        run: python -m compileall -q python/pantheon tests/test_pantheon_engine.py
      - name: Run Pantheon safety and provenance tests
        run: python -m unittest tests.test_pantheon_engine -v
