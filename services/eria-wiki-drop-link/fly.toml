# Replace this with a globally unique Fly app name before launch.
app = "replace-with-unique-eria-app-name"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  ERIA_DATA_DIR = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  method = "GET"
  path = "/health"
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"

[mounts]
  source = "eria_data"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
