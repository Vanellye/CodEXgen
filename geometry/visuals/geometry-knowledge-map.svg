<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Geometry knowledge map</title><desc id="desc">A map connecting geometric intellect, shapes, constructions and designs, with observations kept in a separate linked domain.</desc>
<rect width="1200" height="620" rx="28" fill="#101827"/>
<text x="60" y="65" fill="#f8fafc" font-family="Arial,sans-serif" font-size="32" font-weight="700">GEOMETRY KNOWLEDGE MAP</text>
<text x="60" y="99" fill="#a9bdd4" font-family="Arial,sans-serif" font-size="17">How definitions become forms, constructions, and designs</text>
<g stroke="#64748b" stroke-width="3" fill="none"><path d="M600 190V240M300 340H900M300 340V390M600 240V390M900 340V390"/><path d="M600 390V455"/></g>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="390" y="125" width="420" height="68" rx="18" fill="#1e3a5f" stroke="#7dd3fc" stroke-width="3"/><text x="600" y="168" fill="#f8fafc" font-size="25" font-weight="700">GEOMETRICAL INTELLECT</text>
<rect x="130" y="285" width="340" height="90" rx="18" fill="#243b53" stroke="#7dd3fc" stroke-width="3"/><text x="300" y="323" fill="#f8fafc" font-size="24">SHAPES</text><text x="300" y="350" fill="#b9c9dc" font-size="16">Definitions · properties · dimensions</text>
<rect x="430" y="285" width="340" height="90" rx="18" fill="#302b55" stroke="#c4b5fd" stroke-width="3"/><text x="600" y="323" fill="#f8fafc" font-size="24">CONSTRUCTIONS</text><text x="600" y="350" fill="#c9c1e5" font-size="16">Coordinates · transformations · proofs</text>
<rect x="730" y="285" width="340" height="90" rx="18" fill="#3b2e4f" stroke="#f0abfc" stroke-width="3"/><text x="900" y="323" fill="#f8fafc" font-size="24">DESIGNS</text><text x="900" y="350" fill="#d7c4e1" font-size="16">Patterns · tessellations · compositions</text>
<rect x="380" y="455" width="440" height="74" rx="18" fill="#183c35" stroke="#86efac" stroke-width="3"/><text x="600" y="486" fill="#f8fafc" font-size="22">VISUAL ATLAS &amp; MAPS</text><text x="600" y="511" fill="#b7d8cc" font-size="16">Illustrative reference material</text>
<rect x="60" y="555" width="1080" height="42" rx="12" fill="#342f1d" stroke="#fbbf24" stroke-width="2" stroke-dasharray="8 6"/><text x="600" y="583" fill="#fde68a" font-size="17">SEPARATE LINKED DOMAIN: empirical observations, measurements, telemetry &amp; data graphs</text>
