<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Dimension and projection map</title><desc id="desc">A conceptual map from a point to a line, plane, solid, and higher-dimensional mathematical spaces, with projection links.</desc>
<rect width="1200" height="520" rx="28" fill="#101827"/>
<text x="60" y="66" fill="#f8fafc" font-family="Arial,sans-serif" font-size="32" font-weight="700">DIMENSION &amp; PROJECTION MAP</text>
<text x="60" y="100" fill="#a9bdd4" font-family="Arial,sans-serif" font-size="17">Conceptual hierarchy • projection reduces represented dimensions, not the original object's dimension</text>
<g stroke="#64748b" stroke-width="3" fill="none"><path d="M180 250H1020"/><path d="M1020 250l-16 -10m16 10-16 10"/></g>
<g font-family="Arial,sans-serif" text-anchor="middle">
<g><circle cx="180" cy="250" r="12" fill="#7dd3fc"/><text x="180" y="310" fill="#f8fafc" font-size="22">0D · Point</text><text x="180" y="340" fill="#9fb0c4" font-size="16">Position</text></g>
<g><path d="M360 220v60" stroke="#7dd3fc" stroke-width="8" stroke-linecap="round"/><text x="360" y="310" fill="#f8fafc" font-size="22">1D · Line</text><text x="360" y="340" fill="#9fb0c4" font-size="16">Length</text></g>
<g><rect x="510" y="215" width="90" height="70" fill="#7dd3fc" fill-opacity=".18" stroke="#7dd3fc" stroke-width="4"/><text x="555" y="310" fill="#f8fafc" font-size="22">2D · Plane</text><text x="555" y="340" fill="#9fb0c4" font-size="16">Length + width</text></g>
<g><path d="M735 205l60 30v70l-60-30zM735 205l-60 30v70l60-30m60-40-60 40-60-40" fill="#c4b5fd" fill-opacity=".18" stroke="#c4b5fd" stroke-width="3"/><text x="735" y="350" fill="#f8fafc" font-size="22">3D · Solid</text><text x="735" y="380" fill="#9fb0c4" font-size="16">Length + width + height</text></g>
<g><rect x="930" y="212" width="100" height="76" rx="14" fill="#f0abfc" fill-opacity=".16" stroke="#f0abfc" stroke-width="3" stroke-dasharray="8 6"/><text x="980" y="310" fill="#f8fafc" font-size="22">4D+ · nD</text><text x="980" y="340" fill="#9fb0c4" font-size="16">Additional coordinates</text></g>
</g>
<path d="M735 185C735 130 555 130 555 185" stroke="#fbbf24" stroke-width="3" fill="none" stroke-dasharray="7 7"/>
<text x="645" y="145" fill="#fbbf24" font-family="Arial,sans-serif" font-size="17" text-anchor="middle">Projection / cross-section</text>
<text x="60" y="455" fill="#a9bdd4" font-family="Arial,sans-serif" font-size="17">A drawing of a higher-dimensional object is a representation or projection, not direct visual access to extra spatial axes.</text>
</svg>