<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Geometric shape atlas</title><desc id="desc">A labeled visual atlas of two-dimensional and three-dimensional geometric forms.</desc>
<rect width="1200" height="560" rx="28" fill="#101827"/>
<text x="64" y="68" fill="#f8fafc" font-family="Arial,sans-serif" font-size="34" font-weight="700">GEOMETRIC SHAPE ATLAS</text>
<text x="64" y="104" fill="#a9bdd4" font-family="Arial,sans-serif" font-size="18">Ideal mathematical forms • schematic, not to scale</text>
<line x1="600" y1="138" x2="600" y2="500" stroke="#41536b" stroke-width="2"/>
<text x="72" y="165" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="22" font-weight="700">2D · PLANE GEOMETRY</text>
<text x="642" y="165" fill="#c4b5fd" font-family="Arial,sans-serif" font-size="22" font-weight="700">3D · SOLID GEOMETRY</text>
<g fill="none" stroke="#7dd3fc" stroke-width="5" stroke-linejoin="round">
<circle cx="155" cy="260" r="55"/><rect x="275" y="205" width="110" height="110"/><polygon points="480,205 540,315 420,315"/><polygon points="155,370 220,408 195,482 115,482 90,408"/>
</g>
<g fill="#cbd5e1" font-family="Arial,sans-serif" font-size="18" text-anchor="middle">
<text x="155" y="340">Circle</text><text x="330" y="340">Square</text><text x="480" y="340">Triangle</text><text x="155" y="520">Pentagon</text>
</g>
<g fill="none" stroke="#c4b5fd" stroke-width="5" stroke-linejoin="round">
<circle cx="735" cy="255" r="55"/><ellipse cx="735" cy="255" rx="55" ry="18"/><path d="M680 255v22c0 30 110 30 110 0v-22"/>
<polygon points="890,205 945,237 945,300 890,332 835,300 835,237"/><path d="M890 205v64m-55-32 55 32 55-32M890 269l-55 31m55-31 55 31"/>
<path d="M1050 215h90l-45 112z"/><ellipse cx="1095" cy="215" rx="45" ry="13"/>
</g>
<g fill="#cbd5e1" font-family="Arial,sans-serif" font-size="18" text-anchor="middle">
<text x="735" y="365">Sphere</text><text x="890" y="365">Cube</text><text x="1095" y="365">Cone</text>
</g>
<text x="642" y="450" fill="#94a3b8" font-family="Arial,sans-serif" font-size="17">A solid has extent in three spatial dimensions.</text>
<text x="642" y="480" fill="#94a3b8" font-family="Arial,sans-serif" font-size="17">Projection can represent depth on a flat page.</text>
</svg>