# Non-secret provider registry. Selection is explicit; there is no automatic fallback.
default_provider: internal_simulator
execution_mode: SIMULATION_ONLY
live_execution: DISABLED
provider_selection: EXPLICIT
fallback_policy: NONE
providers:
  internal_simulator:
    provider_id: internal_simulator
    family: simulator
    enabled: true
    environment: INTERNAL_SIMULATOR
    capabilities:
      accounts.read: true
      balances.read: true
      transactions.read: true
      transfers.preview: true
      transfers.simulate: true
      reconciliation.read: true
    credentials: NONE
    network_access: false
    health_check: deterministic_local
  plaid:
    provider_id: plaid
    family: account_data
    enabled: false
    environment: SANDBOX
    status: NOT_CONFIGURED
  coinbase_cdp:
    provider_id: coinbase_cdp
    family: crypto_custody
    enabled: false
    environment: TESTNET
    status: NOT_CONFIGURED
  wise:
    provider_id: wise
    family: payments
    enabled: false
    environment: SANDBOX
    status: NOT_CONFIGURED
