name: Driveway starter validation
on:
  push:
    paths: ["driveway/**"]
  pull_request:
    paths: ["driveway/**"]
jobs:
  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: driveway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run build
